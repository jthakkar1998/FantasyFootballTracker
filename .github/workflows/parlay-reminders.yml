name: Parlay missing-pick reminders
on:
  schedule:
    # Thu/Fri/Sat 8 PM Chicago is 01:00 UTC (CDT) or 02:00 UTC (CST) the next day.
    - cron: "0,15 1,2 * * 5,6,0"
    # Sunday 9 AM Chicago is 14:00 UTC (CDT) or 15:00 UTC (CST).
    - cron: "0,15 14,15 * * 0"
    # Sunday 11:30 AM Chicago is 16:30 UTC (CDT) or 17:30 UTC (CST).
    - cron: "30,35,40 16,17 * * 0"
  workflow_dispatch:

jobs:
  reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send reminders to missing teams
        env:
          REMINDER_URL: ${{ secrets.PARLAY_REMINDER_URL }}
          CRON_TOKEN: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$REMINDER_URL" ] || [ -z "$CRON_TOKEN" ]; then
            echo "Missing PARLAY_REMINDER_URL or CRON_SECRET repository secret."
            exit 1
          fi
          # --fail-with-body makes server errors visible in the Actions log;
          # the response reports slot, sent, skipped and failed counts.
          curl --fail-with-body --show-error --silent --max-time 70 --retry 2 \
            -H "Authorization: Bearer $CRON_TOKEN" "$REMINDER_URL"
