name: Parlay missing-pick reminders
on:
  schedule:
    # 8:00 PM Chicago time Thu/Fri/Sat: 01:00 UTC (CDT) or 02:00 UTC (CST), following calendar day.
    - cron: "0,15 1,2 * * 5,6,0"
    # Sunday 9:00 AM Chicago: 14:00 UTC (CDT) / 15:00 UTC (CST).
    - cron: "0,15 14,15 * * 0"
    # Sunday 11:30 AM Chicago: 16:30 UTC (CDT) / 17:30 UTC (CST).
    - cron: "30,35,40 16,17 * * 0"
  workflow_dispatch:

jobs:
  reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Send reminders to missing teams
        env:
          REMINDER_URL: $&#123;&#123; secrets.PARLAY_REMINDER_URL &#125;&#125;
          CRON_TOKEN: $&#123;&#123; secrets.CRON_SECRET &#125;&#125;
        run: |
          test -n "$REMINDER_URL" && test -n "$CRON_TOKEN"
          curl --fail --show-error --silent --max-time 70 --retry 2 \
            -H "Authorization: Bearer $CRON_TOKEN" "$REMINDER_URL"
